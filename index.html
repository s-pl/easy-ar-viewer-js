<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR básico con model-viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body>
  
    <model-viewer src="model.glb"
                  alt="Mi modelo 3D"
                  ar
                  ar-modes="webxr scene-viewer quick-look"
                  camera-controls
                  auto-rotate
                  style="width:100%; max-width:800px; height:600px;">
    </model-viewer>
    
  </body>
</html>
